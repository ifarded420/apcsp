<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Minecraft Block Quiz</title>
  <style>
    body { background:#1c1c1c; color:#f0f0f0; font-family:"Courier New",monospace;
           display:flex; justify-content:center; align-items:center; min-height:100vh; }
    .screen { display:none; text-align:center; padding:24px; max-width:360px; width:100%; }
    .screen.active { display:block; }
    h1 { color:#5ece3f; margin-bottom:10px; }
    img { width:150px; height:150px; image-rendering:pixelated;
          border:4px solid #5ece3f; display:block; margin:12px auto; background:#333; }
    button { background:#5ece3f; border:3px solid #3a8a25; color:#1c1c1c;
             font-family:"Courier New",monospace; font-weight:bold; padding:10px;
             margin:5px auto; cursor:pointer; display:block; width:220px; }
    button:hover { background:#74e254; }
    #score { color:#5ece3f; margin-top:8px; }
  </style>
</head>
<body>

  <div id="startScreen" class="screen active">
    <h1>Minecraft Block Quiz</h1>
    <p>2 questions — can you name the block?</p>
    <button id="startBtn">Start</button>
  </div>

  <div id="quizScreen" class="screen">
    <p id="prog">Question 1 of 2</p>
    <p>What block is this?</p>
    <img id="blockImg" src="" alt="Minecraft block">
    <button class="choice" id="c0"></button>
    <button class="choice" id="c1"></button>
    <p id="score">Score: 0 / 2</p>
  </div>

  <div id="resultsScreen" class="screen">
    <h1>Done!</h1>
    <p id="result"></p>
    <button id="againBtn">Play Again</button>
  </div>

  <!--
    Block textures: InventivetalentDev/minecraft-assets (GitHub, MIT License)
    https://github.com/InventivetalentDev/minecraft-assets
    Images not created by student.
  -->
  <script>
    var BASE = "https://raw.githubusercontent.com/InventivetalentDev/minecraft-assets/1.20.4/assets/minecraft/textures/block/";

    // List of quiz questions (APCSP: list of information)
    var questions = [
      { img: BASE + "oak_planks.png",  choices: ["Oak Log",   "Oak Planks"],  correct: 1 },
      { img: BASE + "cobblestone.png", choices: ["Cobblestone", "Stone"],     correct: 0 }
    ];

    var currentQ = 0;
    var userAnswers = [];

    // Function with parameter, if-statement, and for loop (APCSP requirement)
    function countCorrect(answerList) {
      var score = 0;
      for (var i = 0; i < answerList.length; i++) {
        if (answerList[i] === questions[i].correct) {
          score = score + 1;
        }
      }
      return score;
    }

    function showScreen(id) {
      document.querySelectorAll(".screen").forEach(function(s) { s.classList.remove("active"); });
      document.getElementById(id).classList.add("active");
    }

    function loadQuestion(i) {
      var q = questions[i];
      document.getElementById("prog").textContent = "Question " + (i + 1) + " of " + questions.length;
      document.getElementById("blockImg").src = q.img;
      document.getElementById("c0").textContent = q.choices[0];
      document.getElementById("c1").textContent = q.choices[1];
      document.getElementById("score").textContent = "Score: " + countCorrect(userAnswers) + " / " + questions.length;
    }

    function handleAnswer(choice) {
      userAnswers.push(choice);
      currentQ = currentQ + 1;
      if (currentQ < questions.length) {
        loadQuestion(currentQ);
      } else {
        var final = countCorrect(userAnswers);
        showScreen("resultsScreen");
        document.getElementById("result").textContent =
          "You got " + final + " out of " + questions.length + " correct!";
      }
    }

    document.getElementById("startBtn").addEventListener("click", function() {
      currentQ = 0; userAnswers = [];
      showScreen("quizScreen");
      loadQuestion(0);
    });

    document.getElementById("c0").addEventListener("click", function() { handleAnswer(0); });
    document.getElementById("c1").addEventListener("click", function() { handleAnswer(1); });

    document.getElementById("againBtn").addEventListener("click", function() {
      showScreen("startScreen");
    });
  </script>
</body>
</html>
